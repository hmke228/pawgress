[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pawgress"
version = "0.1.0"
description = "A Python CLI for the Pawgress CS 467 Capstone Project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=7,<8",
]

[project.scripts]
pawgress = "pawgress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=pawgress --cov-report=term-missing"

[tool.coverage.report]
fail_under = 91
precision = 2
